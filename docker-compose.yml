      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - payment-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net

  payment-consumer-worker:
    container_name: payment-consumer-worker
    build:
      context: ./api/payment-service
      dockerfile: Dockerfile
    env_file:
      - ./api/payment-service/.env
    command: ["./app", "consumer-worker"]
    restart: unless-stopped
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - payment-db-net
      - redis-net
      - rabbitmq-net
