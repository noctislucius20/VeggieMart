services:
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ui:
        condition: service_started
      api-gateway-service:
        condition: service_started
    networks:
      - api-gateway-net

  user-db:
    container_name: user-db
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: user-service
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - postgres_user_data:/var/lib/postgresql
    networks:
      - user-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  user-service:
    container_name: user-service
    build:
      context: ./api/user-service
      dockerfile: Dockerfile
    env_file:
      - ./api/user-service/.env
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - user-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net
      - api-gateway-net

  user-publisher-worker:
    container_name: user-publisher-worker
    build:
      context: ./api/user-service
      dockerfile: Dockerfile
    env_file:
      - ./api/user-service/.env
    command: ["./app", "publisher-worker"]
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
