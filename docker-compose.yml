  notification-db:
    container_name: notification-db
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: notification-service
    env_file:
      - .env
    restart: unless-stopped
