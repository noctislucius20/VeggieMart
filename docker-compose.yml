    build:
      context: ./api/notification-service
      dockerfile: Dockerfile
    env_file:
      - ./api/notification-service/.env
    command: ["./app", "consumer-worker"]
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - notification-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net

  api-gateway-service:
    container_name: api-gateway-service
    build:
      context: ./api/api-gateway
      dockerfile: Dockerfile
    env_file:
      - ./api/api-gateway/.env
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - redis-net
      - api-gateway-net

  ui:
    container_name: ui
    build:
      context: ./ui
      dockerfile: Dockerfile
    env_file:
      - ./ui/.env
    restart: unless-stopped
    depends_on:
      api-gateway-service:
        condition: service_started
    networks:
      - api-gateway-net

  redis:
    container_name: redis
    image: redis:8.4
    restart: unless-stopped
    networks:
      - redis-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RBMQ_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RBMQ_PASS}
    networks:
      - rabbitmq-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s

  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    restart: unless-stopped
    networks:
      - elasticsearch-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -vq ''"status":"red"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_user_data:
  postgres_product_data:
  postgres_order_data:
  postgres_payment_data:
  postgres_notification_data:

networks:
  user-db-net:
  product-db-net:
  order-db-net:
  payment-db-net:
  notification-db-net:
  redis-net:
  rabbitmq-net:
  elasticsearch-net:
  api-gateway-net:
