services:
  user-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: user-service
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - postgres_user_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - user-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  user-service:
    build: 
      context: ./user-service
      dockerfile: Dockerfile
    env_file:
      - ./user-service/.env
    ports:
      - "8080:8080"
    command: ["./app", "start"]
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - user-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net
      - api-gateway-net
  
  user-publisher-worker:
    build: 
      context: ./user-service
      dockerfile: Dockerfile
    env_file:
      - ./user-service/.env
    command: ["./app", "publisher-worker"]
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - user-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net

