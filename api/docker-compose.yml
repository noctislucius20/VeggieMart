  payment-service:
    build: 
      context: ./payment-service
      dockerfile: Dockerfile
    env_file:
      - ./payment-service/.env
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - payment-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net
      - api-gateway-net
  
  payment-publisher-worker:
    build: 
      context: ./payment-service
      dockerfile: Dockerfile
    env_file:
      - ./payment-service/.env
    command: ["./app", "publisher-worker"]
    restart: unless-stopped
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - payment-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net

  notification-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: notification-service
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - postgres_notification_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - notification-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  notification-service:
    build: 
      context: ./notification-service
      dockerfile: Dockerfile
    env_file:
      - ./notification-service/.env
    ports:
      - "8084:8084"
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - notification-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net
      - api-gateway-net
  
  notification-consumer-worker:
    build: 
      context: ./notification-service
      dockerfile: Dockerfile
    env_file:
      - ./notification-service/.env
    command: ["./app", "consumer-worker"]
    restart: unless-stopped
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - notification-db-net
      - redis-net
      - rabbitmq-net
      - elasticsearch-net

  api-gateway-service:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    env_file:
      - ./notification-service/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - redis-net
      - api-gateway-net

  redis:
    image: redis:8.4
    restart: unless-stopped
    ports:
    - "127.0.0.1:6379:6379"
    networks:
    - redis-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RBMQ_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RBMQ_PASS}
    networks:
      - rabbitmq-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  elasticsearch:
    image: elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    restart: unless-stopped
    networks:
      - elasticsearch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_user_data:
  postgres_product_data:
  postgres_order_data:
  postgres_payment_data:
  postgres_notification_data:

networks:
  user-db-net:
  product-db-net:
  order-db-net:
  payment-db-net:
  notification-db-net:
  redis-net:
  rabbitmq-net:
  elasticsearch-net:
  api-gateway-net:

